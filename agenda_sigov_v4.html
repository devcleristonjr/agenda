<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SIGOV – Agenda e Recepção</title>
    <style>
      /* ===== Tokens ===== */
      :root {
        --wine: #970808;
        --wine-bright: #9b0102;
        --dark: #450f0f;
        --wine-tint: #fff1f2;
        --bg: #eef1f5;
        --surface: #fff;
        --line: #e2e8f0;
        --ink: #334155;
        --ink-strong: #1e293b;
        --muted: #64748b;
        --radius: 8px;
        --header-bg: linear-gradient(90deg, var(--wine-bright), var(--dark));

        --planned: #64748b;
        --wait: #f59e0b;
        --inside: #2563eb;
        --done: #15803d;

        /* Tipos de compromisso */
        --t-birthday: #c0143c;
        --t-hearing: #f5a30b;
        --t-event: #8cc21a;
      }

      /* ===== Base ===== */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
      [hidden] { display: none !important; }
      .time-num { font-variant-numeric: tabular-nums; }

      /* ===== Topo ===== */
      .top {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 18px;
        color: #fff;
        background: var(--header-bg);
        box-shadow: 0 3px 8px #0003;
      }
      .brand { font-weight: 900; font-size: 20px; letter-spacing: 0.08em; white-space: nowrap; }
      .active-tab { display: flex; align-items: center; align-self: stretch; padding: 0 16px; font-weight: 700; background: #ffffff1a; border-bottom: 4px solid #fff; }

      /* ===== Estrutura ===== */
      .shell { min-height: calc(100vh - 58px); }
      main { padding: 20px; min-width: 0; width: 100%; max-width: 1440px; margin: 0 auto; }

      .title { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
      .title h1 { margin: 0; color: var(--ink-strong); font-size: 22px; }
      .title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .date-nav { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .date-nav input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }

      /* ===== Componentes ===== */
      .btn {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 13px;
        font-weight: 700;
        transition: background 0.15s, border-color 0.15s;
      }
      .btn.sm { padding: 5px 10px; font-size: 12px; }
      .btn.primary { background: var(--wine); color: #fff; }
      .btn.primary:hover { background: var(--dark); }
      .btn.light { background: #fff; border-color: #cbd5e1; color: #475569; }
      .btn.light:hover { background: #f8fafc; border-color: #94a3b8; }
      .btn.danger { background: #fff; border-color: #fecaca; color: #b91c1c; margin-right: auto; }
      .btn.danger:hover { background: #fef2f2; }

      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px #0f172a0d; }
      .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line); font-weight: 700; }
      .head small { font-weight: 600; color: var(--muted); }

      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
      .stat { padding: 14px; border-left: 4px solid var(--c, var(--wine)); }
      .stat span { font-size: 10px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
      .stat strong { display: block; font-size: 26px; line-height: 1.1; margin-top: 3px; color: var(--ink-strong); }

      .tools { padding: 12px; display: grid; grid-template-columns: 1fr 170px auto; gap: 9px; margin-bottom: 14px; }
      .tools input, .tools select { border: 1px solid #cbd5e1; border-radius: 5px; padding: 9px 10px; background: #fff; }

      /* ===== Lista ===== */
      .row {
        --type-color: var(--t-hearing);
        display: grid;
        grid-template-columns: 92px minmax(0, 1.6fr) 80px 170px auto;
        gap: 12px;
        align-items: center;
        padding: 12px 13px;
        border-bottom: 1px solid var(--line);
        border-left: 4px solid var(--type-color);
      }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: #fffafa; }
      .row.now { background: var(--wine-tint); }
      .row.s-done .name { color: var(--muted); }
      .time strong { display: block; font-weight: 900; color: var(--wine); font-size: 15px; }
      .time span { font-size: 11px; color: var(--muted); }
      .name { font-weight: 800; color: var(--ink-strong); }
      .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .place { font-weight: 600; }
      .state { display: flex; flex-wrap: wrap; gap: 5px; }
      .acts { display: flex; gap: 6px; justify-content: flex-end; }

      .pill { border-radius: 99px; padding: 4px 9px; font-size: 11px; font-weight: 800; background: #f1f5f9; color: #475569; }
      .pill.s-wait { background: #fef3c7; color: #92400e; }
      .pill.s-inside { background: #dbeafe; color: #1e40af; }
      .pill.s-done { background: #dcfce7; color: #166534; }
      .pill.now-tag { background: var(--wine); color: #fff; }
      .pill.warn { background: #fee2e2; color: #991b1b; }

      .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--line); }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px 5px 9px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: #fff;
        font-size: 12px;
        font-weight: 600;
      }
      .legend-item:hover { border-color: #94a3b8; }
      .legend-item[aria-pressed="true"] { border-color: var(--wine); background: var(--wine-tint); }
      .legend-item span { color: var(--muted); font-weight: 700; }
      .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; }
      .sub .dot { margin-right: 6px; vertical-align: -1px; }

      .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

      /* ===== Governador ===== */
      .gov { margin-top: 14px; border-top: 4px solid var(--wine); }
      .govgrid { padding: 13px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
      .govitem {
        text-align: left;
        padding: 11px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 6px;
      }
      .govitem:hover { border-color: #fb923c; }
      .govitem b { display: block; color: var(--wine); }
      .govempty { grid-column: 1 / -1; color: var(--muted); }

      /* ===== WhatsApp ===== */
      .wa { margin-top: 14px; padding: 14px; }
      .wa pre {
        white-space: pre-wrap;
        font: inherit;
        background: #f8fafc;
        border: 1px solid var(--line);
        padding: 12px;
        border-radius: 6px;
        margin: 10px 0;
      }

      /* ===== Modal ===== */
      dialog { border: 0; padding: 0; border-radius: 9px; width: min(580px, calc(100% - 24px)); box-shadow: 0 20px 50px #0f172a66; }
      dialog::backdrop { background: #0f172a99; }
      .mhead { padding: 14px 16px; background: var(--header-bg); color: #fff; font-weight: 700; }
      .form { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form label { font-size: 12px; font-weight: 700; }
      .form input, .form select {
        display: block;
        width: 100%;
        margin-top: 5px;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-weight: 400;
        background: #fff;
      }
      .form input:user-invalid { border-color: #dc2626; }
      .wide { grid-column: 1 / -1; }
      .form[data-kind="gov"] .meeting-only, .form[data-birthday="true"] .timed-only { display: none; }
      .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }

      /* ===== Aviso ===== */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        max-width: calc(100% - 24px);
        padding: 11px 16px;
        border-radius: 8px;
        background: var(--ink-strong);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 24px #0f172a55;
      }

      /* ===== Responsivo ===== */
      @media (max-width: 960px) {
        .row { grid-template-columns: 92px minmax(0, 1fr); }
        .row .place { grid-column: 2; margin-top: -8px; font-size: 12px; color: var(--muted); }
        .row .state, .row .acts { grid-column: 1 / -1; justify-content: flex-start; }
      }
      @media (max-width: 800px) {
        .stats { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 500px) {
        .stats, .tools, .form { grid-template-columns: 1fr; }
        .wide { grid-column: auto; }
        .title { flex-direction: column; }
        main { padding: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; scroll-behavior: auto !important; }
      }
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:10px}.calendar-day{min-height:95px;text-align:left;background:white;border:1px solid var(--line);border-radius:6px;padding:7px;overflow-wrap:anywhere}.calendar-day[aria-current="date"]{border:2px solid var(--wine)}.calendar-day small{display:block;margin-top:5px;border-left:3px solid var(--event-color,var(--wine));padding-left:4px}.calendar-day.muted{opacity:.55}.form textarea{width:100%;min-height:65px;border:1px solid var(--line);border-radius:5px;padding:8px;font:inherit}.form[data-event="true"] .hearing-only,.form[data-birthday="true"] .event-only,.form:not([data-event="true"]) .event-only,.form:not([data-birthday="true"]) .birthday-only,.form:not([data-kind="gov"]) .gov-only,.form[data-birthday="true"] .hearing-only{display:none}.form{max-height:75vh;overflow:auto}@media(max-width:650px){.calendar-grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media print{.top,.tools,.date-nav,.acts,#new,#new-gov,#views,#print{display:none!important}.shell{display:block}main{max-width:none}}
 
.top{position:sticky;top:0;z-index:10}.title{margin-bottom:18px}.title h1{font-size:26px}.card{border-radius:10px}.stat{cursor:pointer;text-align:left;background:white;color:var(--ink)}.stat[aria-pressed=true],#views button[aria-pressed=true]{outline:2px solid var(--wine);outline-offset:-2px;background:var(--wine-tint)}#views{margin:0 0 14px}.row{grid-template-columns:100px minmax(0,1.7fr) minmax(100px,1fr) 155px auto}.row .name button{border:0;background:none;text-align:left;padding:0;font-weight:800;color:inherit}.row .name button:hover{text-decoration:underline}.section-label{padding:9px 14px;background:#f8fafc;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.live-card{padding:15px}.live-card strong{display:block;font-size:18px;margin:5px 0}.live-card small{color:var(--muted)}.live-card button{margin-top:8px}.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.type-choice{text-align:left;padding:16px;background:white;border:1px solid var(--line);border-top:4px solid var(--choice);border-radius:8px}.type-choice:hover{background:#f8fafc}.type-choice b,.type-choice small{display:block}.type-choice small{color:var(--muted);margin-top:5px}#details{position:fixed;inset:0;margin:auto;height:auto;max-height:calc(100dvh - 40px);width:min(480px,calc(100% - 32px));max-width:100%;border-radius:14px;overflow:auto;color:var(--ink);box-shadow:0 24px 80px #0f172a40}#details::backdrop{background:#0f172a55;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}#details .mhead{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink-strong);border-bottom:1px solid var(--line);padding:14px 20px}#detail-close{border:0;background:#f1f5f9;font-size:20px;line-height:1;padding:6px 10px}#detail-body{padding:20px}#detail-body h2{margin:0 0 16px;font-size:21px;color:var(--ink-strong)}#detail-body dl{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2fr);gap:10px 16px;align-items:baseline;margin:0}#detail-body dt{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:0}#detail-body dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}#detail-body .detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.executive .operational,.executive .acts,.executive #new-gov,.executive .state,.executive #filter,.executive #live{display:none!important}.executive .row{grid-template-columns:100px minmax(0,2fr) minmax(100px,1fr)}.executive .tools{grid-template-columns:1fr auto}.toast button{margin-left:12px;color:white;background:transparent;border:1px solid white;border-radius:4px;padding:4px 8px}.form label{line-height:1.5}.pill.s-cancel{background:#fee2e2;color:#991b1b}.pill.s-absent{background:#e2e8f0;color:#475569}.row .sub{overflow-wrap:anywhere}.row .place{overflow-wrap:anywhere}@media(max-width:960px){.row,.executive .row{grid-template-columns:80px minmax(0,1fr)}.row .place{grid-column:2}.row .state,.row .acts{grid-column:1/-1}}@media(max-width:600px){.live-grid,.type-grid{grid-template-columns:1fr}.title>div:last-child{display:flex;flex-wrap:wrap;gap:5px}.tools,.executive .tools{grid-template-columns:1fr}.calendar-grid{grid-template-columns:repeat(7,minmax(105px,1fr));overflow:auto}.calendar-day{min-height:85px}.top{height:54px}}@media print{#mode,#live,.operational,#details,#choose,.toast{display:none!important}.top{position:static}.row{break-inside:avoid}.card{box-shadow:none}.row .name button{color:black}}
.birthday-row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}.birthday-icon{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:10px;background:#fff1f2;color:var(--t-birthday)}.birthday-info{flex:1;min-width:0;overflow-wrap:anywhere}.birthday-name{border:0;background:none;padding:0;text-align:left;color:var(--ink-strong);font-weight:750;font-size:15px}.birthday-name:hover{text-decoration:underline}.birthday-row .sub{margin-top:3px}.birthday-row .btn{border-color:transparent;background:transparent;font-size:17px}.section-label{letter-spacing:.055em}

/* Compact, content-sized details modal */
#details{inset:50% auto auto 50%;transform:translate(-50%,-50%);margin:0;width:min(680px,calc(100% - 32px));height:fit-content;min-height:0;max-height:calc(100dvh - 40px);box-sizing:border-box;border:1px solid #e2e8f0;border-radius:14px;background:#fff;overflow:auto}

/* Shared column geometry for every appointment, regardless of available actions. */
#list{--commit-columns:100px minmax(0,1.8fr) minmax(110px,1fr) 168px 210px}
#list .row,#list .commit-columns{display:grid;grid-template-columns:var(--commit-columns);gap:16px;align-items:center;padding:14px 16px;border-left-width:4px;box-sizing:border-box}
#list .commit-columns{border-left:4px solid transparent;border-bottom:1px solid var(--line);background:#fff;color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.045em;padding-top:10px;padding-bottom:10px}

  <body>
    <header class="top">
      <div class="brand">SIGOV</div>
      <span class="active-tab" aria-current="page">Agenda</span>
    </header>

    <div class="shell">
      <main>
        

        <div class="title">
          <div>
            <h1>Agenda do Secretário</h1>
            <p id="subtitle">Controle de compromissos, visitantes e atendimento no prédio</p>
            <div class="date-nav">
              <button class="btn light sm" id="prev" aria-label="Dia anterior">‹</button>
              <input type="date" id="date" aria-label="Data da agenda" />
              <button class="btn light sm" id="next" aria-label="Próximo dia">›</button>
              <button class="btn light sm" id="today">Hoje</button>
            </div>
          </div>
          <div><button class="btn light" id="mode" aria-pressed="false">Modo secretário</button> <button class="btn light" id="print">Imprimir</button> <button class="btn primary operational" id="new">+ Novo registro</button></div>
        </div>

        <div id="views" class="date-nav" role="group" aria-label="Visualização"><button class="btn light" data-view="day">Dia</button><button class="btn light" data-view="week">Semana</button><button class="btn light" data-view="month">Mês</button></div>
        <section class="card" id="calendar" hidden></section>
        <section id="live" class="live-grid" aria-label="Acompanhamento de hoje" hidden></section><section class="stats operational" aria-label="Resumo do dia">
          <button type="button" class="card stat" data-status="all" style="--c: var(--wine)"><span>Compromissos</span><strong id="st-total">0</strong></button>
          <button type="button" class="card stat" data-status="Aguardando" style="--c: var(--wait)"><span>Aguardando</span><strong id="st-wait">0</strong></button>
          <button type="button" class="card stat" data-status="No prédio" style="--c: var(--inside)"><span>Em atendimento</span><strong id="st-inside">0</strong></button>
          <button type="button" class="card stat" data-status="Finalizado" style="--c: var(--done)"><span>Finalizados</span><strong id="st-done">0</strong></button>
        </section>

        <section class="card tools">
          <input id="search" type="search" placeholder="Buscar participante, município ou instituição" aria-label="Buscar" />
          <select id="filter" aria-label="Filtrar por status"></select>
          <button class="btn light" id="whats" aria-expanded="false" aria-controls="wa">Resumo WhatsApp</button>
        </section>

        <section class="card">
          <div class="head"><span id="list-title"></span><small id="list-count"></small></div>
          <div class="legend" id="legend" role="group" aria-label="Filtrar por tipo de compromisso"></div>
          <div id="list"></div>
        </section>

        <section class="card gov">
          <div class="head">
            <span>Reservas de Agenda com o Governador</span>
            <button class="btn light sm" id="new-gov">+ Reserva</button>
          </div>
          <div class="govgrid" id="gov"></div>
        </section>

        <section class="card wa" id="wa" hidden>
          <b>Resumo para WhatsApp</b>
          <pre id="watext"></pre>
          <button class="btn primary" id="copy">Copiar texto</button>
        </section>
      </main>
    </div>

    <dialog id="choose" aria-labelledby="choose-title"><div class="mhead" id="choose-title">Qual tipo de registro deseja criar?</div><div class="type-grid"><button class="type-choice" style="--choice:var(--t-birthday)" data-kind="Aniversário"><b>🎂 Aniversário</b><small>Lembrete de dia todo</small></button><button class="type-choice" style="--choice:var(--t-hearing)" data-kind="Audiência"><b>Audiência</b><small>Reunião e atendimento</small></button><button class="type-choice" style="--choice:var(--t-event)" data-kind="Evento"><b>Evento</b><small>Compromisso institucional</small></button><button class="type-choice" style="--choice:var(--wine)" data-kind="gov"><b>Reserva GOV</b><small>Agenda com o governador</small></button></div><div style="padding:0 16px 16px;text-align:right"><button class="btn light" id="choose-close">Cancelar</button></div></dialog>
    <dialog id="details" aria-labelledby="detail-title"><div class="mhead"><span id="detail-title">Detalhes do registro</span><button class="btn light sm" id="detail-close" aria-label="Fechar detalhes">×</button></div><div id="detail-body"></div></dialog>
    <dialog id="dialog">
      <div class="mhead" id="dialog-title">Novo registro de agenda</div>
      <form class="form" id="form" method="dialog" novalidate>
        <input type="hidden" name="id" /><label class="wide">Data<input type="date" name="date" required /></label>
        <label class="meeting-only wide">Tipo<select name="type"></select></label>
        <label class="timed-only">Horário de início<input name="start" type="time" required /></label>
        <label class="meeting-only timed-only">Horário de fim<input name="end" type="time" required /></label>
        <label class="wide"><span id="name-label">Participante / compromisso</span><input name="name" required autocomplete="off" /></label>
        <label class="meeting-only timed-only hearing-only">Status<select name="status"></select></label>
        <label class="meeting-only person-only">Cargo / função<input name="role" autocomplete="off" /></label>
        <label class="meeting-only">Município / instituição<input name="org" autocomplete="off" /></label>
        <label class="meeting-only timed-only wide">Local<input name="place" required /></label>
        <label class="meeting-only timed-only wide">Pauta<input name="topic" /></label><label class="meeting-only event-only wide">Endereço<input name="address" /></label><label class="meeting-only birthday-only wide">Repetição<select name="annual"><option value="no">Somente nesta data</option><option value="yes">Anualmente</option></select></label><label class="gov-only wide">Confirmação<select name="confirmation"><option>Pendente</option><option>Confirmado</option><option>Cancelado</option></select></label><label class="wide">Observações internas<textarea name="notes"></textarea></label><div class="actions">
          <button type="button" class="btn danger" id="delete" hidden>Excluir</button>
          <button type="button" class="btn light" id="cancel">Cancelar</button>
          <button type="submit" class="btn primary">Salvar</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      "use strict";

      /* ===== Configuração ===== */
      const SECRETARY = "Adolpho Loyola";
      const DEFAULT_PLACE = "COI";
      const STORAGE_KEY = "sigov.agenda.v4";
      const DEMO_DATE = "2026-11-24"; // data dos dados de exemplo

      const STATUSES = ["Previsto", "Aguardando", "No prédio", "Finalizado", "Cancelado", "Não compareceu"];
      const STATUS_CLASS = {
        "Previsto": "",
        "Aguardando": "s-wait",
        "No prédio": "s-inside",
        "Finalizado": "s-done", "Cancelado":"s-cancel", "Não compareceu":"s-absent",
      };
      // Tipos de compromisso: cada um tem uma cor (definida em :root)
      const TYPES = {
        "Aniversário": "var(--t-birthday)",
        "Audiência": "var(--t-hearing)",
        "Evento": "var(--t-event)",
      };
      const DEFAULT_TYPE = "Audiência";
      const typeOf = (item) => (item.type in TYPES ? item.type : DEFAULT_TYPE);

      // Fluxo da recepção: cada status leva ao próximo
      const NEXT_STEP = {
        "Previsto": { to: "Aguardando", label: "Registrar chegada" },
        "Aguardando": { to: "No prédio", label: "Iniciar atendimento" },
        "No prédio": { to: "Finalizado", label: "Finalizar" },
      };

      /* ===== Utilitários ===== */
      const $ = (selector) => document.querySelector(selector);
      const pad = (n) => String(n).padStart(2, "0");
      const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      // Remove acentos e caixa para buscas tolerantes ("municipio" encontra "Município")
      const fold = (text) => text.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

      const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const parseISODate = (iso) => new Date(`${iso}T12:00:00`);
      const shiftDate = (iso, days) => {
        const d = parseISODate(iso);
        d.setDate(d.getDate() + days);
        return toISODate(d);
      };
      const formatShortDate = (iso) => iso.split("-").reverse().join("/");
      const formatWeekday = (iso) => parseISODate(iso).toLocaleDateString("pt-BR", { weekday: "long" });
      const formatTime = (t) => t.replace(":", "h");
      const formatRange = (item) => (item.end ? `${formatTime(item.start)} - ${formatTime(item.end)}` : formatTime(item.start));
      const nowHHMM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

      /* ===== Dados e persistência ===== */
      const meeting = (start, end, name, role, org, status, type = DEFAULT_TYPE) =>
        ({ id: newId(), kind: "meeting", date: DEMO_DATE, start, end, name, role, org, place: DEFAULT_PLACE, status, type });
      const reservation = (start, name) =>
        ({ id: newId(), kind: "gov", date: DEMO_DATE, start, end: "", name, role: "", org: "", place: "", status: "", type: "" });

      const seedData = () => [
        meeting("08:30", "10:30", "Líderes de Partido da ALBA", "Café da manhã", "ALBA", "Finalizado", "Evento"),
        meeting("10:30", "11:00", "Je", "Prefeito", "Ibirapitanga", "Aguardando"),
        meeting("11:00", "12:00", "Silva Neto", "Deputado eleito", "ALBA", "Aguardando"),
        meeting("15:30", "16:30", "Alan Mori", "Representante", "Energisa Gás", "Previsto"),
        reservation("14:30", "Despacho GOV"),
        reservation("16:30", "Reunião com a Comissão de Transição do Governo"),
        reservation("18:00", "Reunião de Construção Município 417"),
      ];

      function loadItems() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved)) return saved;
        } catch { /* sem armazenamento disponível: usa os dados de exemplo */ }
        return seedData();
      }

      function saveItems() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items)); } catch { /* ignora */ }
      }

      const state = { items: loadItems(), date: DEMO_DATE, query: "", status: "all", type: "all", view: "day", executive: false };

      /* ===== Consultas ===== */
      const byStart = (a, b) => Number(isBirthday(b)) - Number(isBirthday(a)) || a.start.localeCompare(b.start);
      const occurs = (i,date) => i.date === date || (isBirthday(i) && i.annual === "yes" && date >= i.date && i.date.slice(5) === date.slice(5));
      const dayItems = (kind) => state.items.filter((i) => occurs(i,state.date) && i.kind === kind).sort(byStart);
      const isBirthday = (item) => item.kind === "meeting" && typeOf(item) === "Aniversário";
      const active = (i) => !["Cancelado","Não compareceu"].includes(i.status);
      const isHearing = (i) => i.kind === "meeting" && typeOf(i) === "Audiência";
      const overlaps = (a, b) => active(a) && active(b) && !isBirthday(a) && !isBirthday(b) && a.start < b.end && b.start < a.end;

      function findConflicts(meetings) {
        const ids = new Set();
        meetings.forEach((a, i) => meetings.slice(i + 1).forEach((b) => {
          if (overlaps(a, b)) { ids.add(a.id); ids.add(b.id); }
        }));
        return ids;
      }

      function currentMeetingId(meetings) {
        if (state.date !== toISODate(new Date())) return null;
        const now = nowHHMM();
        return meetings.find((m) => active(m) && !isBirthday(m) && m.start <= now && now < m.end && m.status !== "Finalizado")?.id ?? null;
      }

      function filterMeetings(meetings) {
        const q = fold(state.query.trim());
        return meetings.filter((m) =>
          (state.status === "all" || m.status === state.status) &&
          (state.type === "all" || typeOf(m) === state.type) &&
          fold(`${m.name} ${m.role} ${m.org} ${m.place}`).includes(q));
      }

      /* ===== Renderização ===== */
      function renderHeader() {
        $("#date").value = state.date;
        $("#subtitle").textContent =
          `Controle de compromissos, visitantes e atendimento no prédio - ${formatShortDate(state.date)} (${formatWeekday(state.date)})`;
        $("#list-title").textContent = "Agenda do dia";
      }

      function renderStats(meetings, gov) {
        const count = (status) => meetings.filter((m) => isHearing(m) && m.status === status).length;
        $("#st-total").textContent = meetings.length + gov.length;
        $("#st-wait").textContent = count("Aguardando");
        $("#st-inside").textContent = count("No prédio");
        $("#st-done").textContent = count("Finalizado");
      }

      function rowTemplate(m, { conflict, current }) {
        const birthday = isBirthday(m);
        if (birthday) return `<article class="birthday-row"><span class="birthday-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16v8H4zM3 21h18M4 16c2 2 4 2 6 0 2 2 4 2 6 0 2 2 3 2 4 0M8 13V9m4 4V9m4 4V9M8 6v1m4-3v3m4-1v1"/></svg></span><div class="birthday-info"><button class="birthday-name" data-action="details" data-id="${escapeHtml(m.id)}">${escapeHtml(m.name)}</button><div class="sub">${escapeHtml(["Aniversário",m.role,m.org].filter(Boolean).join(" · "))}</div></div><button class="btn light sm operational" data-action="details" data-id="${escapeHtml(m.id)}" aria-label="Detalhes de ${escapeHtml(m.name)}">•••</button></article>`;
        const cls = isHearing(m) ? (STATUS_CLASS[m.status] || "") : "";
        const type = typeOf(m);
        const next = isHearing(m) ? NEXT_STEP[m.status] : null;
        const detail = [m.role, m.org].filter(Boolean).join(" - ");
        return `
          <article class="row ${cls} ${current ? "now" : ""}" style="--type-color: ${TYPES[type]}">
            <div class="time time-num">${birthday ? "<strong>Dia todo</strong>" : `<strong>${formatTime(m.start)}</strong><span>até ${formatTime(m.end)}</span>`}</div>
            <div>
              <div class="name"><button data-action="details" data-id="${escapeHtml(m.id)}">${escapeHtml(m.name)}</button></div>
              <div class="sub"><i class="dot" style="background: ${TYPES[type]}"></i>${type}${detail ? ` - ${escapeHtml(detail)}` : ""}</div>
            </div>
            <div class="place">${birthday ? "" : escapeHtml(m.place)}${m.address ? `<div class="sub">${escapeHtml(m.address)}</div>` : ""}${m.topic ? `<div class="sub">Pauta: ${escapeHtml(m.topic)}</div>` : ""}${isHearing(m) && m.arrivedAt ? `<div class="sub">Chegada: ${escapeHtml(m.arrivedAt)}${m.startedAt ? " · Início: "+escapeHtml(m.startedAt) : ""}${m.finishedAt ? " · Fim: "+escapeHtml(m.finishedAt) : ""}</div>` : ""}</div>
            <div class="state">
              ${isHearing(m) ? `<span class="pill ${cls}">${escapeHtml(m.status === "No prédio" ? "Em atendimento" : m.status)}${m.status==="Aguardando" && state.date===toISODate(new Date()) && m.arrivedAt ? " · "+elapsed(m.arrivedAt)+" min" : ""}</span>` : ""}
              ${current ? '<span class="pill now-tag">Agora</span>' : ""}
              ${conflict ? '<span class="pill warn">Conflito de horário</span>' : ""}
            </div>
            <div class="acts">
              ${next ? `<button class="btn primary sm" data-action="advance" data-id="${m.id}">${next.label}</button>` : ""}
              <button class="btn light sm" data-action="details" data-id="${m.id}" aria-label="Detalhes de ${escapeHtml(m.name)}">•••</button>
            </div>
          </article>`;
      }

      function renderList(meetings) {
        const visible = filterMeetings(meetings);
        const conflicts = findConflicts(meetings);
        const currentId = currentMeetingId(meetings);
        const filtering = state.query || state.status !== "all" || state.type !== "all";

        $("#list-count").textContent = filtering ? `${visible.length} de ${meetings.length}` : `${meetings.length} compromissos`;
        $("#list").innerHTML = visible.length
          ? [true,false].map(b=>{const group=visible.filter(m=>isBirthday(m)===b);return group.length?`<div class="section-label">${b?"Lembretes do dia":"Compromissos"}</div>`+(b?"":`<div class="commit-columns"><span>Horário</span><span>Compromisso</span><span>Local</span><span class="column-status">Status</span><span class="column-actions">Ações</span></div>`)+group.map(m=>rowTemplate(m,{conflict:conflicts.has(m.id),current:m.id===currentId})).join(""):"";}).join("")
          : `<div class="empty">${filtering ? "Nenhum compromisso encontrado com esses filtros." : 'Nenhum compromisso neste dia. Use "+ Novo registro" para adicionar.'}</div>`;
      }

      function renderLegend(meetings) {
        $("#legend").innerHTML = Object.entries(TYPES).map(([type, color]) => {
          const count = meetings.filter((m) => typeOf(m) === type).length;
          return `<button class="legend-item" data-type="${type}" aria-pressed="${state.type === type}">
            <i class="dot" style="background: ${color}"></i>${type}<span>${count}</span></button>`;
        }).join("");
      }

      function renderGov(gov) {
        $("#gov").innerHTML = gov.length
          ? gov.map((g) => `<button class="govitem" data-action="details" data-id="${g.id}"><b class="time-num">${formatTime(g.start)}</b>${escapeHtml(g.name)}<small style="display:block">${escapeHtml(g.confirmation || "Pendente")}</small></button>`).join("")
          : '<p class="govempty">Nenhuma reserva para este dia.</p>';
      }

      function renderCalendar() {
        const panel = $("#calendar");
        panel.hidden = state.view === "day";
        document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===state.view)));
        if(panel.hidden) return;
        const d=parseISODate(state.date);
        const first=state.view==="week"?shiftDate(state.date,-((d.getDay()+6)%7)):toISODate(new Date(d.getFullYear(),d.getMonth(),1,12));
        const offset=state.view==="month"?(parseISODate(first).getDay()+6)%7:0;
        const start=shiftDate(first,-offset);
        const n=state.view==="week"?7:Math.ceil((offset+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7)*7;
        panel.innerHTML='<div class="head">'+escapeHtml(state.view==="week"?"Semana de "+formatShortDate(first):d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}))+'</div><div class="calendar-grid">'+Array.from({length:n},(_,j)=>{
          const date=shiftDate(start,j), items=state.items.filter(i=>occurs(i,date)).sort(byStart);
          return '<button class="calendar-day '+(date.slice(0,7)!==state.date.slice(0,7)&&state.view==="month"?"muted":"")+'" data-date="'+date+'" aria-current="'+(date===state.date?"date":"false")+'"><b>'+formatShortDate(date).slice(0,5)+' · '+escapeHtml(formatWeekday(date))+'</b>'+items.map(i=>'<small style="--event-color:'+(i.kind==="gov"?"var(--wine)":TYPES[typeOf(i)])+'">'+(isBirthday(i)?"🎂 ":escapeHtml(formatTime(i.start))+" ")+escapeHtml(i.name)+'</small>').join("")+'</button>';
        }).join("")+'</div>';
      }
      function navigate(delta){
        if(state.view==="month"){const d=parseISODate(state.date);d.setDate(1);d.setMonth(d.getMonth()+delta);goToDate(toISODate(d));}
        else goToDate(shiftDate(state.date,delta*(state.view==="week"?7:1)));
      }
      function render() {
        const meetings = dayItems("meeting");
        const gov = dayItems("gov");
        renderHeader();
        renderCalendar();
        renderLive();
        document.querySelectorAll("[data-status]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.status===state.status)));
        renderStats(meetings, gov);
        renderLegend(meetings);
        renderList(meetings);
        renderGov(gov);
        if (!$("#wa").hidden) $("#watext").textContent = buildSummary();
      }

      /* ===== Aviso (toast) ===== */
      let toastTimer;
      function toast(message) {
        const el = $("#toast");
        el.textContent = message;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.hidden = true), 4000);
      }

      /* ===== Formulário ===== */
      const dialog = $("#dialog");
      const form = $("#form");

      let formSnapshot = "", detailId = null, undoItem = null;
      function openForm(kind, item = null, chosen = DEFAULT_TYPE) {
        const isGov = kind === "gov";
        form.reset();
        form.querySelectorAll("input, select, textarea").forEach((el) => (el.disabled = false));
        form.dataset.kind = kind;
        // Campos desabilitados não são validados nem enviados
        form.querySelectorAll(".meeting-only :is(input, select)").forEach((el) => (el.disabled = isGov));

        $("#dialog-title").textContent = item
          ? (isGov ? "Editar reserva do Governador" : "Editar registro de agenda")
          : (isGov ? "Nova reserva do Governador" : "Novo registro de agenda");
        $("#name-label").textContent = isGov ? "Descrição da reserva" : "Participante / compromisso";
        $("#delete").hidden = !item;

        const values = item
          ? { status: "Previsto", confirmation: "Pendente", annual: "no", ...item, type: typeOf(item) }
          : { date: state.date, place: DEFAULT_PLACE, status: "Previsto", type: chosen, annual: "no", confirmation: "Pendente" };
        for (const [field, value] of Object.entries({ id: item?.id ?? "", ...values })) {
          if (form.elements[field] && !form.elements[field].disabled) form.elements[field].value = value ?? "";
        }
        syncFormType();
        if (kind==="meeting" && !form.elements.status.value) form.elements.status.value="Previsto";
        formSnapshot=JSON.stringify([...new FormData(form)]);
        dialog.showModal();
      }

      function syncFormType() {
        const gov = form.dataset.kind === "gov";
        const birthday = !gov && form.elements.type.value === "Aniversário";
        const event = !gov && form.elements.type.value === "Evento";
        form.dataset.birthday = String(birthday);
        form.dataset.event = String(event);
        form.querySelectorAll(".timed-only :is(input, select)").forEach((el) => {
          el.disabled = birthday || (gov && el.closest(".meeting-only") !== null);
        });
        form.querySelectorAll(".hearing-only,.event-only,.birthday-only,.gov-only,.person-only").forEach(label=>{const hidden=(label.matches(".hearing-only")&&(gov||birthday||event))||(label.matches(".event-only")&&!event)||(label.matches(".birthday-only")&&!birthday)||(label.matches(".gov-only")&&!gov)||(label.matches(".person-only")&&(gov||event));label.hidden=hidden;label.querySelectorAll("input,select,textarea").forEach(el=>el.disabled=hidden);});
        $("#name-label").textContent = gov ? "Descrição da reserva" : birthday ? "Nome do aniversariante" : event ? "Nome do evento" : "Participante / compromisso";
        validateTimes();
      }

      // O horário de fim precisa ser posterior ao de início
      function validateTimes() {
        const { start, end } = form.elements;
        end.setCustomValidity(!end.disabled && end.value && start.value && end.value <= start.value
          ? "O horário de fim deve ser posterior ao horário de início." : "");
      }

      function submitForm(event) {
        event.preventDefault();
        validateTimes();
        if (!form.reportValidity()) return;

        const data = Object.fromEntries(new FormData(form));
        const isGov = form.dataset.kind === "gov";
        const existing = state.items.find((i) => i.id === data.id);
        const item = {
          id: data.id || newId(),
          kind: form.dataset.kind,
          date: data.date,
          topic: (data.topic ?? "").trim(), address: (data.address ?? "").trim(), notes: (data.notes ?? "").trim(), annual: data.annual ?? "no", confirmation: data.confirmation ?? "",
          arrivedAt: data.type === "Audiência" && existing?.date === data.date ? existing.arrivedAt ?? "" : "", startedAt: data.type === "Audiência" && existing?.date === data.date ? existing.startedAt ?? "" : "", finishedAt: data.type === "Audiência" && existing?.date === data.date ? existing.finishedAt ?? "" : "",
          start: data.start ?? "",
          end: data.end ?? "",
          name: data.name.trim(),
          role: (data.role ?? "").trim(),
          org: (data.org ?? "").trim(),
          place: (data.place ?? "").trim(),
          status: data.type === "Audiência" ? (existing && existing.date !== data.date ? "Previsto" : data.status || "Previsto") : "",
          type: isGov ? "" : data.type,
        };

        if (!item.name) { toast("Informe um nome válido."); return; }
        if (!isGov && state.items.some(i=>i.id!==item.id && i.kind==="meeting" && occurs(i,item.date) && overlaps(i,item)) && !confirm("Existe conflito de horário. Deseja salvar mesmo assim?")) return;
        state.items = existing ? state.items.map((i) => (i.id === item.id ? item : i)) : [...state.items, item];
        saveItems();
        state.date = item.date;
        dialog.close();
        render();

        const hasConflict = !isGov && findConflicts(dayItems("meeting")).has(item.id);
        toast(hasConflict ? "Salvo, mas o horário conflita com outro compromisso." : existing ? "Registro atualizado." : "Registro adicionado.");
      }

      function deleteCurrent() {
        const item = state.items.find((i) => i.id === form.elements.id.value);
        if (!item || !confirm(`Excluir "${item.name}" da agenda?`)) return;
        state.items = state.items.filter((i) => i.id !== item.id);
        saveItems();
        dialog.close();
        render();
        undoItem=item;
        toast("Registro excluído.");
        const undo=document.createElement("button");undo.textContent="Desfazer";undo.onclick=()=>{if(undoItem&&!state.items.some(i=>i.id===undoItem.id)){state.items.push(undoItem);saveItems();render();}undoItem=null;toast("Registro restaurado.");};$("#toast").append(undo);
      }

      /* ===== Ações ===== */
      function advanceStatus(id) {
        const item = state.items.find((i) => i.id === id);
        const step = item && isHearing(item) && NEXT_STEP[item.status];
        if (!step) return;
        item.status = step.to;
        const field = {"Aguardando":"arrivedAt","No prédio":"startedAt","Finalizado":"finishedAt"}[step.to];
        if(field) item[field] = nowHHMM();
        saveItems();
        render();
      }

      function handleItemClick(event) {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const item = state.items.find((i) => i.id === button.dataset.id);
        if (!item) return;
        if (button.dataset.action === "advance") advanceStatus(item.id);
        if (button.dataset.action === "edit") openForm(item.kind, item);
        if (button.dataset.action === "details") showDetails(item);
      }

      function elapsed(t){if(!t)return 0;const [h,m]=t.split(":").map(Number),n=new Date();return Math.max(0,n.getHours()*60+n.getMinutes()-h*60-m);}
      function renderLive(){
        const panel=$("#live");panel.hidden=state.date!==toISODate(new Date())||state.executive||state.view!=="day";if(panel.hidden)return;
        const items=dayItems("meeting").filter(i=>active(i)&&!isBirthday(i)&&i.status!=="Finalizado");
        const current=items.find(i=>isHearing(i)&&i.status==="No prédio")||items.find(i=>i.start<=nowHHMM()&&nowHHMM()<i.end);
        const next=[...items,...dayItems("gov").filter(i=>i.confirmation!=="Cancelado")].sort(byStart).find(i=>i.id!==current?.id&&i.start>nowHHMM());
        panel.innerHTML=[[current,"AGORA"],[next,"PRÓXIMO COMPROMISSO"]].map(([i,label])=>'<div class="card live-card"><small>'+label+'</small><strong>'+escapeHtml(i?.name||"Nenhum compromisso")+'</strong>'+(i?'<div>'+escapeHtml(formatRange(i))+(i.startedAt?" · "+elapsed(i.startedAt)+" min de atendimento":"")+'</div><button class="btn light sm" data-action="details" data-id="'+escapeHtml(i.id)+'">Ver detalhes</button>':'')+'</div>').join("");
      }
      function showDetails(i){
        detailId=i.id;const panel=$("#details"),step=isHearing(i)&&NEXT_STEP[i.status];
        const fields=[["Tipo",i.kind==="gov"?"Reserva GOV":typeOf(i)],["Data",formatShortDate(state.date)],["Horário",isBirthday(i)?"Dia todo":formatRange(i)],["Cargo",i.role],["Instituição",i.org],["Local",i.place],["Endereço",i.address],["Pauta",i.topic],["Status",i.kind==="gov"?i.confirmation:isHearing(i)?(i.status==="No prédio"?"Em atendimento":i.status):""],...(!state.executive?[["Observações internas",i.notes],["Chegada",i.arrivedAt],["Início real",i.startedAt],["Término real",i.finishedAt]]:[])];
        $("#detail-body").innerHTML='<h2>'+escapeHtml(i.name)+'</h2><dl>'+fields.filter(x=>x[1]).map(x=>'<div class="detail-field'+(["Pauta","Observações internas","Endereço"].includes(x[0])?' detail-wide':'')+'"><dt>'+x[0]+'</dt><dd>'+escapeHtml(x[1])+'</dd></div>').join("")+'</dl>'+(!state.executive?'<div class="detail-actions">'+(step?'<button class="btn primary" data-detail="advance">'+step.label+'</button>':'')+'<button class="btn light" data-detail="edit">Editar</button><button class="btn light" data-detail="duplicate">Duplicar</button></div>':'');
        if(!panel.open)panel.showModal();
      }
      function closeForm(){if(JSON.stringify([...new FormData(form)])!==formSnapshot&&!confirm("Descartar alterações não salvas?"))return;dialog.close();}
      function goToDate(iso) {
        if (!iso) return;
        state.date = iso;
        render();
      }

      /* ===== Resumo para WhatsApp ===== */
      function buildSummary() {
        const meetings = dayItems("meeting");
        const gov = dayItems("gov");
        const places = [...new Set(meetings.filter((m) => !isBirthday(m)).map((m) => m.place).filter(Boolean))];
        const singlePlace = places.length === 1;

        const lines = [`*Agenda Sec. ${SECRETARY} - ${formatShortDate(state.date)} (${formatWeekday(state.date)})*`];
        if (singlePlace) lines.push(`📍 *Local:* ${places[0]}`);

        const blocks = meetings.map((m) => {
          const detail = [m.role, m.org].filter(Boolean).join(" - ");
          if (isBirthday(m)) return `🎂 *Aniversário:* ${m.name}${detail ? ` | ${detail}` : ""}`;
          if (!active(m)) return `*${m.status}:* ${m.name}`;
          return [
            `🕞 *Horário ${formatRange(m)}*`,
            `🔹 *${typeOf(m)==="Evento"?"Evento":"Participante"}:* ${m.name}${detail ? ` | ${detail}` : ""}`,
            ...(singlePlace || !m.place ? [] : [`📍 *Local:* ${m.place}`]),
          ].join("\n");
        });
        lines.push("", blocks.length ? blocks.join("\n\n") : "Nenhum compromisso registrado.");

        if (gov.length) {
          lines.push("", "‼️ *RESERVAS DE AGENDA COM O GOVERNADOR* ‼️");
          gov.forEach((g) => lines.push(`*${formatTime(g.start)} | ${g.name.toLocaleUpperCase("pt-BR")}* (${g.confirmation || "Pendente"})`));
        }
        return lines.join("\n");
      }

      function toggleSummary() {
        const panel = $("#wa");
        panel.hidden = !panel.hidden;
        $("#whats").setAttribute("aria-expanded", String(!panel.hidden));
        if (panel.hidden) return;
        $("#watext").textContent = buildSummary();
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      async function copySummary() {
        const text = $("#watext").textContent;
        const button = $("#copy");
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "Copiado!";
        } catch {
          // Alternativa para páginas abertas sem permissão de área de transferência
          const area = Object.assign(document.createElement("textarea"), { value: text });
          document.body.append(area);
          area.select();
          button.textContent = document.execCommand("copy") ? "Copiado!" : "Selecione e copie manualmente";
          area.remove();
        }
        setTimeout(() => (button.textContent = "Copiar texto"), 2000);
      }

      /* ===== Inicialização ===== */
      function init() {
        document.addEventListener("keydown",e=>{if(e.altKey&&e.key.toLowerCase()==="n"&&!state.executive&&!document.querySelector("dialog[open]")){e.preventDefault();$("#choose").showModal();}});
        $("#filter").innerHTML = ['<option value="all">Todos os status</option>', ...STATUSES.map((s) => `<option>${s}</option>`)].join("");
        form.elements.status.innerHTML = STATUSES.map((s) => `<option>${s}</option>`).join("");
        form.elements.type.innerHTML = Object.keys(TYPES).map((t) => `<option>${t}</option>`).join("");
        $("#legend").addEventListener("click", (e) => {
          const button = e.target.closest("[data-type]");
          if (!button) return;
          state.type = state.type === button.dataset.type ? "all" : button.dataset.type;
          render();
        });

        $("#search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
        $("#filter").addEventListener("change", (e) => { state.status = e.target.value; render(); });
        $("#new").addEventListener("click", () => $("#choose").showModal());
        $("#choose-close").onclick=()=>$("#choose").close();
        $("#choose").addEventListener("click",e=>{const b=e.target.closest("[data-kind]");if(!b)return;$("#choose").close();openForm(b.dataset.kind==="gov"?"gov":"meeting",null,b.dataset.kind);});
        $("#mode").onclick=()=>{state.executive=!state.executive;document.body.classList.toggle("executive",state.executive);$("#mode").textContent=state.executive?"Modo operacional":"Modo secretário";$("#mode").setAttribute("aria-pressed",String(state.executive));state.status="all";$("#filter").value="all";render();};
        document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{state.status=state.status===b.dataset.status?"all":b.dataset.status;$("#filter").value=state.status;render();});
        $("#live").addEventListener("click",handleItemClick);
        $("#detail-close").onclick=()=>$("#details").close();
        $("#details").addEventListener("click",e=>{if(e.target!==$("#details"))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});
        $("#detail-body").addEventListener("click",e=>{const b=e.target.closest("[data-detail]"),i=state.items.find(x=>x.id===detailId);if(!b||!i||state.executive)return;if(b.dataset.detail==="advance"){advanceStatus(i.id);showDetails(i);}else{$("#details").close();if(b.dataset.detail==="edit")openForm(i.kind,i);else{openForm(i.kind,{...i,id:"",date:state.date,status:"Previsto",arrivedAt:"",startedAt:"",finishedAt:""});$("#delete").hidden=true;$("#dialog-title").textContent="Duplicar registro";}}});
        $("#new-gov").addEventListener("click", () => openForm("gov"));
        $("#list").addEventListener("click", handleItemClick);
        $("#gov").addEventListener("click", handleItemClick);

        $("#prev").addEventListener("click", () => navigate(-1));
        $("#next").addEventListener("click", () => navigate(1));
        $("#today").addEventListener("click", () => goToDate(toISODate(new Date())));
        $("#date").addEventListener("change", (e) => goToDate(e.target.value));

        $("#views").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b){state.view=b.dataset.view;render();}});
        $("#calendar").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(b){state.view="day";goToDate(b.dataset.date);}});
        $("#print").addEventListener("click",()=>window.print());
        $("#whats").addEventListener("click", toggleSummary);
        $("#copy").addEventListener("click", copySummary);

        form.addEventListener("submit", submitForm);
        form.elements.type.addEventListener("change", syncFormType);
        form.elements.start.addEventListener("input", validateTimes);
        form.elements.end.addEventListener("input", validateTimes);
        $("#delete").addEventListener("click", deleteCurrent);
        $("#cancel").addEventListener("click", closeForm);
        dialog.addEventListener("cancel",e=>{e.preventDefault();closeForm();});
        dialog.addEventListener("click", (e) => { if (e.target === dialog) closeForm(); });

        // Atualiza o destaque "Agora" a cada minuto
        setInterval(() => {renderList(dayItems("meeting"));renderLive();}, 60000);
        render();
      }

      init();
    </script>
  </body>
</html>
